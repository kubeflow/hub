name: Run go generate
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 0 * * 1" # Monday 12 AM UTC

permissions: read-all

jobs:
  go-generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.3"
      - name: Run go generate
        run: go generate ./...
      - name: Check if there are uncommitted file changes
        run: |
          clean=$(git status --porcelain)
          if [[ -z "$clean" ]]; then
              echo "Empty git status --porcelain: $clean"
          else
              echo "Uncommitted file changes detected: $clean"
              git diff
          fi
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          branch: sync-go-generate
          commit-message: "chore: sync go generated output"
          signoff: true
          title: "chore: sync go generated output"
          body: |-
            Results from running `go generate ./...`
