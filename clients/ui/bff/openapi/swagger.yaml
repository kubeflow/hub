  /api/v1/model_catalog/sources/{source_id}/performance_artifacts/{model_name}:
    get:
      description: |-
        Returns performance evaluation artifacts for a model. Set targetRPS to calculate replicas and total_requests_per_second custom properties for the requested throughput.
        recommendations filters out configurations that are less optimal in approximate cost and latency. Metric-property parameters select the throughput, latency, hardware-count, and hardware-grouping properties used in those calculations.
        orderBy accepts ID, NAME, CREATE_TIME, LAST_UPDATE_TIME, or <property>.<value_type>, where value_type is double_value, int_value, or string_value. Examples: mmlu.double_value, framework_type.string_value, hardware_count.int_value.
        Invalid custom-property value types and empty property names return an upstream error. Unrecognized ordering formats fall back to ID ordering; artifacts with the selected property sort before those without it.
        filterQuery supports SQL-like comparisons, LIKE/ILIKE, IN, AND/OR, parentheses, and typed custom-property access. Example: ttft_mean.double_value < 90 AND hardware_count.int_value = 1.
      operationId: getPerformanceArtifacts
      parameters:
        - description: Catalog namespace
          in: query
          name: namespace
          required: true
          schema:
            type: string
        - description: Catalog source ID
          in: path
          name: source_id
          required: true
          schema:
            type: string
        - description: Model name; may contain slashes (for example org/model)
          in: path
          name: model_name
          required: true
          schema:
            type: string
        - description: Maximum number of artifacts in each page
          example: 100
          in: query
          name: pageSize
          schema:
            default: 10
            minimum: 1
            type: integer
        - description: Standard field or <property>.<value_type>; see the operation description
          example: ttft_mean.double_value
          in: query
          name: orderBy
          schema:
            type: string
        - description: Sort direction; defaults to ascending
          example: DESC
          in: query
          name: sortOrder
          schema:
            default: ASC
            enum:
              - ASC
              - DESC
            type: string
        - description: Opaque token from the previous response; reuse it to retrieve the next page
          in: query
          name: nextPageToken
          schema:
            type: string
        - description: SQL-like filter over performance metrics
          example: hardware_count.int_value=1
          in: query
          name: filterQuery
          schema:
            type: string
        - description: Target requests per second; enables calculated replicas and total_requests_per_second properties
          example: 100
          in: query
          name: targetRPS
          schema:
            type: integer
        - description: Filter out less optimal configurations based on approximate cost and latency
          in: query
          name: recommendations
          schema:
            default: false
            type: boolean
        - description: Custom property for the requests-per-second metric
          example: requests_per_second
          in: query
          name: rpsProperty
          schema:
            default: requests_per_second
            type: string
        - description: Custom property for the latency metric, for example ttft_p90 or p90_latency
          example: ttft_p90
          in: query
          name: latencyProperty
          schema:
            default: ttft_p90
            type: string
        - description: Custom property for hardware count
          in: query
          name: hardwareCountProperty
          schema:
            default: hardware_count
            type: string
        - description: Custom property used to group configurations by hardware type
          in: query
          name: hardwareTypeProperty
          schema:
            default: hardware_type
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.catalogModelArtifactsListEnvelope'
          description: Page of performance metrics artifacts
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Bad Request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Internal Server Error
      security:
        - KubeflowUserID: []
        - BearerAuth: []
