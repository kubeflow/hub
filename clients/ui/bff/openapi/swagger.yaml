  /api/v1/settings/model_catalog/source_preview:
    post:
      description: |-
        Tests a source configuration without saving it and returns assets with their inclusion/exclusion status. Accepts a JSON data envelope, not multipart; the BFF translates it to config/catalogData multipart parts for the catalog service.
        For YAML sources, provide catalog content in data.properties.yaml or a configured data.properties.yamlCatalogPath. For Hugging Face sources, properties may include apiKey and allowedOrganization; when editing a saved source, stored credentials can be resolved by data.id.
        assetType=models uses includedModels/excludedModels patterns and model summary counts. assetType=mcp_servers uses includedServers/excludedServers and asset summary counts. Hugging Face results may include hfAccessType and hfGatedAccessGranted; the summary reports inaccessible gated models across all pages.
        Not available in Kubeflow integration mode.
      operationId: previewCatalogSource
      parameters:
        - description: Catalog namespace
          in: query
          name: namespace
          required: true
          schema:
            type: string
        - description: Maximum number of assets in each preview page
          example: 100
          in: query
          name: pageSize
          schema:
            default: 10
            minimum: 1
            type: integer
        - description: Opaque token from the preceding preview page
          in: query
          name: nextPageToken
          schema:
            type: string
        - description: all returns every evaluated asset; included/excluded returns only that inclusion status
          in: query
          name: filterStatus
          schema:
            default: all
            enum:
              - all
              - included
              - excluded
            type: string
        - description: Asset type to preview; selects the inclusion/exclusion fields and summary counters
          in: query
          name: assetType
          schema:
            default: models
            enum:
              - models
              - mcp_servers
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api.Envelope-models_CatalogSourcePreviewRequest-api_None'
              description: Source preview configuration in data
              summary: body
        description: Source preview configuration in data
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.CatalogSourcePreviewEnvelope'
          description: Evaluated assets, pagination token, and source-wide summary
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Bad Request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Invalid configuration or catalog content
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Internal Server Error
      security:
        - KubeflowUserID: []
        - BearerAuth: []
      summary: Preview catalog source configuration effects
      tags:
        - ModelCatalogService
