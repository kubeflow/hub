            housekeeping, and users typically shouldn't need to set or
            understand this field. A workflow can be the user's name, a
            controller's name, or the name of a specific apply path like
            "ci-cd". The set of fields is always in the version that the
            workflow used when modifying the object.

            +optional
            +listType=atomic
            +k8s:alpha(since: "1.37")=+k8s:optional
          items:
            $ref: '#/components/schemas/v1.ManagedFieldsEntry'
          type: array
          uniqueItems: false
        name:
          description: |-
            Name must be unique within a namespace. Is required when creating resources, although
            some resources may allow a client to request the generation of an appropriate name
            automatically. Name is primarily intended for creation idempotence and configuration
            definition.
            Cannot be updated.
            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names#names
            +optional
          type: string
        namespace:
          description: |-
            Namespace defines the space within which each name must be unique. An empty namespace is
            equivalent to the "default" namespace, but "default" is the canonical representation.
            Not all objects are required to be scoped to a namespace - the value of this field for
            those objects will be empty.

            Must be a DNS_LABEL.
            Cannot be updated.
            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces
            +optional
          type: string
        ownerReferences:
          description: |-
            List of objects depended by this object. If ALL objects in the list have
            been deleted, this object will be garbage collected. If this object is managed by a controller,
            then an entry in this list will point to this controller, with the controller field set to true.
            There cannot be more than one managing controller.
            +optional
            +patchMergeKey=uid
            +patchStrategy=merge
            +listType=map
            +listMapKey=uid
            +k8s:alpha(since:"1.37")=+k8s:optional
          items:
            $ref: '#/components/schemas/v1.OwnerReference'
          type: array
          uniqueItems: false
        resourceVersion:
          description: |-
            An opaque value that represents the internal version of this object that can
            be used by clients to determine when objects have changed. May be used for optimistic
            concurrency, change detection, and the watch operation on a resource or set of resources.
            Clients must treat these values as opaque and passed unmodified back to the server.
            They may only be valid for a particular resource or set of resources.

            Populated by the system.
            Read-only.
            Value must be treated as opaque by clients and .
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency
            +optional
          type: string
        selfLink:
          description: |-
            Deprecated: selfLink is a legacy read-only field that is no longer populated by the system.
            +optional
          type: string
        uid:
          description: |-
            UID is the unique in time and space value for this object. It is typically generated by
            the server on successful creation of a resource and is not allowed to change on PUT
            operations.

            Populated by the system.
            Read-only.
            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names#uids
            +optional
            +k8s:alpha(since: "1.37")=+k8s:optional
            +k8s:alpha(since: "1.37")=+k8s:immutable
          type: string
      type: object
    v1.OwnerReference:
      properties:
        apiVersion:
          description: |-
            API version of the referent.
            +k8s:alpha(since:"1.37")=+k8s:required
          type: string
        blockOwnerDeletion:
          description: |-
            If true, AND if the owner has the "foregroundDeletion" finalizer, then
            the owner cannot be deleted from the key-value store until this
            reference is removed.
            See https://kubernetes.io/docs/concepts/architecture/garbage-collection/#foreground-deletion
            for how the garbage collector interacts with this field and enforces the foreground deletion.
            Defaults to false.
            To set this field, a user needs "delete" permission of the owner,
            otherwise 422 (Unprocessable Entity) will be returned.
            +optional
          type: boolean
        controller:
          description: |-
            If true, this reference points to the managing controller.
            +optional
          type: boolean
        kind:
          description: |-
            Kind of the referent.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            +k8s:alpha(since:"1.37")=+k8s:required
          type: string
        name:
          description: |-
            Name of the referent.
            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names#names
            +k8s:alpha(since:"1.37")=+k8s:required
          type: string
        uid:
          description: |-
            UID of the referent.
            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names#uids
            +k8s:alpha(since:"1.37")=+k8s:required
          type: string
      type: object
    v1.RoleRef:
      properties:
        apiGroup:
          description: |-
            apiGroup is the group for the resource being referenced
            +optional
          type: string
        kind:
          description: |-
            kind is the type of resource being referenced
            +required
          type: string
        name:
          description: |-
            name is the name of resource being referenced
            +required
            +k8s:beta(since: "1.37")=+k8s:required
          type: string
      type: object
  securitySchemes:
    BearerAuth:
      description: Bearer token in user_token authentication mode. Header and prefix are configurable.
      scheme: bearer
      type: http
    KubeflowUserID:
      description: User identity in internal authentication mode.
      in: header
      name: kubeflow-userid
      type: apiKey
externalDocs:
  description: Kubeflow Hub BFF documentation
  url: https://github.com/kubeflow/hub/tree/main/clients/ui/bff
info:
  description: REST API for Model Registry BFF
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: Model Registry BFF REST API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/agent_catalog/agents:
    get:
      description: |-
        Lists agents across configured catalog sources, including their frameworks, deployment environment, image artifacts, and Markdown documentation. Use q for keyword search and filterQuery for structured filtering. Not available in Kubeflow integration mode.
        filterQuery supports SQL-like comparisons, LIKE/ILIKE, IN, AND/OR, parentheses, and typed custom-property access. Examples: framework = 'langgraph'; name ILIKE '%research%'. Only the first supplied value of each query parameter is forwarded.
      operationId: findAgents
      parameters:
        - description: Catalog namespace
          in: query
          name: namespace
          required: true
          schema:
            type: string
        - description: Maximum number of agents in each page
          example: 100
          in: query
          name: pageSize
          schema:
            default: 10
            minimum: 1
            type: integer
        - description: Field to order by
          example: NAME
          in: query
          name: orderBy
          schema:
            enum:
              - CREATE_TIME
              - LAST_UPDATE_TIME
              - ID
              - NAME
            type: string
        - description: Sort direction; defaults to ascending
          example: DESC
          in: query
          name: sortOrder
          schema:
            default: ASC
            enum:
              - ASC
              - DESC
            type: string
        - description: Opaque token from the previous response; reuse it to retrieve the next page
          in: query
          name: nextPageToken
          schema:
            type: string
        - description: Free-form keyword search
          example: research
          in: query
          name: q
          schema:
            type: string
        - description: Catalog source ID; only the first supplied value is forwarded
          example: community
          in: query
          name: source
          schema:
            type: string
        - description: Label associated with a catalog source
          example: validated
          in: query
          name: sourceLabel
          schema:
            type: string
        - description: SQL-like expression over agent fields and custom properties
          example: framework='langgraph'
          in: query
          name: filterQuery
          schema:
            type: string
        - description: Filter by agent name using SQL LIKE pattern matching
          example: '%research%'
          in: query
          name: name
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AgentListEnvelope'
          description: Page of catalog agents
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Internal Server Error
      security:
        - KubeflowUserID: []
        - BearerAuth: []
      summary: List agents
      tags:
        - AgentCatalogService
  /api/v1/agent_catalog/agents/{agent_id}:
    get:
      description: Returns the selected agent's framework, Markdown documentation, deployment environment variables, OCI images, and source repository information. Not available in Kubeflow integration mode.
      operationId: getAgent
      parameters:
        - description: Catalog namespace
          in: query
          name: namespace
          required: true
          schema:
            type: string
        - description: Agent ID
          in: path
          name: agent_id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AgentEnvelope'
          description: Agent metadata and deployment information
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Internal Server Error
      security:
        - KubeflowUserID: []
        - BearerAuth: []
      summary: Get an agent
      tags:
        - AgentCatalogService
  /api/v1/agent_catalog/agents/{agent_id}/artifacts:
    get:
      description: Lists deployment artifacts for an agent. Template artifacts contain the full agent.yaml specification as a JSON-encoded string in content; image artifacts carry a URI. Not available in Kubeflow integration mode.
      operationId: getAgentArtifacts
      parameters:
        - description: Catalog namespace
          in: query
          name: namespace
          required: true
          schema:
            type: string
        - description: Agent ID
          in: path
          name: agent_id
          required: true
          schema:
            type: string
        - description: Maximum number of results
          in: query
          name: pageSize
          schema:
            type: integer
        - description: Field to order by
          in: query
          name: orderBy
          schema:
            type: string
        - description: Sort direction
          in: query
          name: sortOrder
          schema:
            enum:
              - ASC
              - DESC
            type: string
        - description: Pagination token
          in: query
          name: nextPageToken
          schema:
            type: string
        - description: Agent artifact category
          in: query
          name: artifactType
          schema:
            enum:
              - template-artifact
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AgentArtifactListEnvelope'
          description: Page of agent deployment artifacts
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Internal Server Error
      security:
        - KubeflowUserID: []
        - BearerAuth: []
      summary: List artifacts for an agent
      tags:
        - AgentCatalogService
  /api/v1/agent_catalog/agents_filter_options:
    get:
      description: Returns filterable agent fields, allowed values or numeric ranges, and named query templates for constructing filterQuery. Not available in Kubeflow integration mode.
      operationId: getAgentsFilterOptions
      parameters:
        - description: Catalog namespace
          in: query
          name: namespace
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AgentFilterOptionsListEnvelope'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Internal Server Error
      security:
        - KubeflowUserID: []
        - BearerAuth: []
      summary: List agent filter options
      tags:
        - AgentCatalogService
  /api/v1/check-namespace-registry-access:
    post:
      description: Checks whether a namespace can access the registry. cannotCheck is true when subject access reviews are forbidden.
      operationId: checkNamespaceRegistryAccess
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api.CheckNamespaceRegistryAccessRequestEnvelope'
              description: Namespace and target registry
              summary: body
        description: Namespace and target registry
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.CheckNamespaceRegistryAccessEnvelope'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Internal Server Error
      security:
        - KubeflowUserID: []
        - BearerAuth: []
      summary: Check namespace access to a model registry
      tags:
        - K8SOperation
  /api/v1/mcp_catalog/mcp_servers:
    get:
      description: |-
        Lists MCP servers with tool counts, transports, deployment mode, security indicators, and runtime requirements. includeTools optionally includes tool metadata. Not available in Kubeflow integration mode.
        filterQuery supports =, !=, <>, >, <, >=, <=, LIKE, ILIKE, IN, AND, OR, and parentheses. Examples: license = 'Apache 2.0'; verifiedSource = true; provider ILIKE '%local%'.
        The BFF forwards only the first value of each query parameter. namedQuery and toolLimit are not forwarded by the BFF.
      operationId: getAllMcpServers
      parameters:
        - description: Catalog namespace
          in: query
          name: namespace
          required: true
          schema:
            type: string
        - description: Maximum number of MCP servers in each page
          example: 100
          in: query
          name: pageSize
          schema:
            default: 10
            minimum: 1
            type: integer
        - description: Field to order by
          example: NAME
          in: query
          name: orderBy
          schema:
            enum:
              - CREATE_TIME
              - LAST_UPDATE_TIME
              - ID
              - NAME
            type: string
        - description: Sort direction; defaults to ascending
          example: DESC
          in: query
          name: sortOrder
          schema:
            default: ASC
            enum:
              - ASC
              - DESC
            type: string
        - description: Opaque token from the previous response; reuse it to retrieve the next page
          in: query
          name: nextPageToken
          schema:
            type: string
        - description: Name of the MCP server to search
          example: filesystem
          in: query
          name: name
          schema:
            type: string
        - description: Free-form keyword search
          example: filesystem
          in: query
          name: q
          schema:
            type: string
        - description: Label associated with a catalog source
          example: validated
          in: query
          name: sourceLabel
          schema:
            type: string
        - description: SQL-like expression over server fields and security indicators
          example: verifiedSource=true
          in: query
          name: filterQuery
          schema:
            type: string
        - description: Include the tools array in each MCP server result
          in: query
          name: includeTools
          schema:
            default: false
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.McpServerListEnvelope'
          description: Page of MCP server metadata
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Bad Request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Internal Server Error
      security:
        - KubeflowUserID: []
        - BearerAuth: []
      summary: List MCP servers
      tags:
        - MCPCatalogService
  /api/v1/mcp_catalog/mcp_servers/{server_id}:
    get:
      description: Returns one MCP server's metadata, transports, deployment prerequisites, security indicators, and optional tool metadata. Not available in Kubeflow integration mode.
      operationId: getMcpServer
      parameters:
        - description: Catalog namespace
          in: query
          name: namespace
          required: true
          schema:
            type: string
        - description: MCP server ID
          in: path
          name: server_id
          required: true
          schema:
            type: string
        - description: Include the tools array in the server response
          in: query
          name: includeTools
          schema:
            default: false
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.McpServerEnvelope'
          description: MCP server metadata
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Bad Request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Internal Server Error
      security:
        - KubeflowUserID: []
        - BearerAuth: []
      summary: Get an MCP server
      tags:
        - MCPCatalogService
  /api/v1/mcp_catalog/mcp_servers/{server_id}/logo:
    get:
      description: Proxies image bytes or an upstream redirect. Not available in Kubeflow integration mode.
      operationId: getMcpServerLogo
      parameters:
        - description: Catalog namespace
          in: query
          name: namespace
          required: true
          schema:
            type: string
        - description: MCP server ID
          in: path
          name: server_id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            image/gif:
              schema:
                format: binary
                type: string
            image/jpeg:
              schema:
                format: binary
                type: string
            image/png:
              schema:
                format: binary
                type: string
            image/svg+xml:
              schema:
                type: string
            image/webp:
              schema:
                type: string
          description: Logo image
        "301":
          description: Permanent redirect to logo URL
          headers:
            Location:
              description: External logo URL
              schema:
                type: string
        "302":
          description: Redirect to logo URL
          headers:
            Location:
              description: External logo URL
              schema:
                type: string
        "303":
          description: See other logo URL
          headers:
            Location:
              description: External logo URL
              schema:
                type: string
        "307":
          description: Temporary redirect to logo URL
          headers:
            Location:
              description: External logo URL
              schema:
                type: string
        "308":
          description: Permanent redirect to logo URL
          headers:
            Location:
              description: External logo URL
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Bad Request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Internal Server Error
      security:
        - KubeflowUserID: []
        - BearerAuth: []
      summary: Get an MCP server logo
      tags:
        - MCPCatalogService
  /api/v1/mcp_catalog/mcp_servers/{server_id}/tools:
    get:
      description: Returns MCP tool metadata with access classification, parameters, and revocation information. The BFF wraps each tool with serverId. Query filtering and pagination options are not forwarded by this route. Not available in Kubeflow integration mode.
      operationId: getMcpServerTools
      parameters:
        - description: Catalog namespace
          in: query
          name: namespace
          required: true
          schema:
            type: string
        - description: MCP server ID
          in: path
          name: server_id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.McpServerToolsListEnvelope'
          description: Tools paired with their server ID
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Bad Request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Internal Server Error
      security:
        - KubeflowUserID: []
        - BearerAuth: []
      summary: List tools for an MCP server
      tags:
        - MCPCatalogService
  /api/v1/mcp_catalog/mcp_servers_filter_options:
    get:
      description: Returns filterable MCP server fields, allowed values or numeric ranges, and named query templates. Not available in Kubeflow integration mode.
      operationId: getMcpServersFilterOptions
      parameters:
        - description: Catalog namespace
          in: query
          name: namespace
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.McpServerFilterOptionsListEnvelope'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Bad Request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Internal Server Error
      security:
        - KubeflowUserID: []
        - BearerAuth: []
      summary: List MCP server filter options
      tags:
        - MCPCatalogService
  /api/v1/model_catalog/labels:
    get:
      description: Returns labels used to categorize catalog sources. Use assetType to list labels for models, MCP servers, or agents.
      operationId: findLabels
      parameters:
        - description: Catalog namespace
          in: query
          name: namespace
          required: true
          schema:
            type: string
        - description: Maximum number of labels in each page
          example: 100
          in: query
          name: pageSize
          schema:
            default: 10
            minimum: 1
            type: integer
        - description: Field to order by
          in: query
          name: orderBy
          schema:
            type: string
        - description: Sort direction; defaults to ascending
          example: DESC
          in: query
          name: sortOrder
          schema:
            default: ASC
            enum:
              - ASC
              - DESC
            type: string
        - description: Opaque token from the previous response; reuse it to retrieve the next page
          in: query
          name: nextPageToken
          schema:
            type: string
        - description: Type of catalog assets whose labels are returned
          example: models
          in: query
          name: assetType
          schema:
            default: models
            enum:
              - models
              - mcp_servers
              - agents
              - skills
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.CatalogLabelListEnvelope'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Bad Request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
