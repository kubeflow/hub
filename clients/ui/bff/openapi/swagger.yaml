        Lists downloadable model artifacts and associated metrics for a catalog model. filterQuery applies a SQL-like filter to artifact fields and custom properties.
        Filter operators: =, !=, <>, >, <, >=, <=, LIKE, ILIKE, IN, AND, OR, and parentheses. Examples: uri LIKE '%s3.amazonaws.com%'; format.string_value = 'pytorch'; ttft_mean > 90.
        orderBy accepts ID, NAME, CREATE_TIME, LAST_UPDATE_TIME, or <property>.<value_type>, where value_type is double_value, int_value, or string_value. Examples: mmlu.double_value, framework_type.string_value, hardware_count.int_value.
        Invalid custom-property value types and empty property names return an upstream error. An unrecognized ordering format falls back to ID ordering. Artifacts with the selected property sort before artifacts without it.
      operationId: getAllModelArtifacts
