      type: object
    models.CatalogModelList:
      description: A page of catalog models with pagination information.
      properties:
        items:
          description: Models returned in this page.
          items:
            $ref: '#/components/schemas/models.CatalogModel'
          type: array
          uniqueItems: false
        nextPageToken:
          description: Opaque token for retrieving the next page; empty when no further page exists.
          type: string
        pageSize:
          description: Maximum number of models requested per page.
          example: 10
          type: integer
        size:
          description: Number of models in this page.
          example: 1
          type: integer
      type: object
    models.CatalogSource:
      properties:
        authenticated:
          description: Authentication status reported by the provider, when available.
          example: true
          type: boolean
        enabled:
          description: Whether this source is enabled for discovery.
          example: true
          type: boolean
        error:
          description: Provider error details, when loading or authentication failed.
          type: string
        hasApiKey:
          description: Whether an API key is available to the provider.
          example: true
          type: boolean
        hfUsername:
          description: Hugging Face username associated with the provider's credentials.
          example: catalog-user
          type: string
        id:
          description: Unique catalog source identifier.
          example: community
          type: string
        labels:
          description: Source labels usable with the sourceLabel query parameter.
          example:
            - community
            - validated
          items:
            type: string
          type: array
          uniqueItems: false
        name:
          description: Human-readable source name.
          example: Community Catalog
          type: string
        status:
          description: Loading or availability status reported by the catalog provider.
