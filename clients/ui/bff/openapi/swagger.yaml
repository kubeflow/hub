servers:
  - description: BFF server
    url: /
  - description: Local BFF server
    url: http://localhost:8080
tags:
  - description: Model Registry REST API for registered models, versions, artifacts, and model transfer jobs.
    name: ModelRegistryService
  - description: Kubernetes-backed discovery, user configuration, namespaces, and registry settings.
    name: K8SOperation
  - description: Model catalog discovery, filtering, evaluation artifacts, and source configuration.
    name: ModelCatalogService
  - description: MCP server discovery, tools, and catalog source configuration.
    name: MCPCatalogService
  - description: Agent discovery, deployment metadata, and deployment artifacts.
    name: AgentCatalogService
