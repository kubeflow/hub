  /api/v1/model_catalog/models:
    get:
      description: |-
        Lists models from configured catalog sources. Use q for keyword search, source/sourceLabel to select a source, and filterQuery for structured filtering.
        filterQuery supports =, !=, <>, >, <, >=, <=, LIKE, ILIKE (case-insensitive matching), IN, AND, OR, and parentheses. Values may be quoted strings, numbers, or booleans.
        Access custom properties by name or with a typed suffix such as framework.string_value, accuracy.double_value, or enabled.bool_value. Use backticks around property names containing special characters, for example `mlflow.source.type` = 'notebook'.
        Examples: name LIKE '%granite%'; accuracy > 0.95; (name = 'model-a' OR name = 'model-b') AND framework.string_value = 'pytorch'.
        orderBy accepts standard fields or custom-property paths such as provider.string_value and artifacts.ifeval.double_value. The BFF forwards only the first value of each query parameter; repeated source/sourceLabel parameters are not combined.
        With recommendations=true or orderBy=RECOMMENDED, Pareto filtering ranks models by recommended latency; the metric-property parameters tune that ranking.
      operationId: findModels
      parameters:
        - description: Catalog namespace
          in: query
          name: namespace
          required: true
          schema:
            type: string
        - description: Maximum number of models in each page
          example: 100
          in: query
          name: pageSize
          schema:
            default: 10
            minimum: 1
            type: integer
        - description: Ordering field (CREATE_TIME, LAST_UPDATE_TIME, ID, NAME, ACCURACY, RECOMMENDED) or a custom-property path
          example: NAME
          in: query
          name: orderBy
          schema:
            type: string
        - description: Sort direction; defaults to ascending
          example: DESC
          in: query
          name: sortOrder
          schema:
            default: ASC
            enum:
              - ASC
              - DESC
            type: string
        - description: Opaque token from the previous response; reuse it to retrieve the next page
          in: query
          name: nextPageToken
          schema:
            type: string
        - description: Free-form keyword search used to filter the response
          example: granite
          in: query
          name: q
          schema:
            type: string
        - description: Catalog source ID to search; only the first supplied value is forwarded
          example: huggingface
          in: query
          name: source
          schema:
            type: string
        - description: Label associated with a catalog source; only the first supplied value is forwarded
          example: validated
          in: query
          name: sourceLabel
          schema:
            type: string
        - description: SQL-like filter expression; see the operation description for operators and property access
          example: name='my-model' AND framework.string_value='pytorch'
          in: query
          name: filterQuery
          schema:
            type: string
        - description: Apply Pareto filtering
          in: query
          name: recommendations
          schema:
            default: false
            type: boolean
        - description: Target requests per second
          example: 100
          in: query
          name: targetRPS
          schema:
            type: integer
        - description: Latency metric property
          in: query
          name: latencyProperty
          schema:
            default: ttft_p90
            type: string
        - description: Throughput metric property
          in: query
          name: rpsProperty
          schema:
            default: requests_per_second
            type: string
        - description: Hardware count property
          in: query
          name: hardwareCountProperty
          schema:
            default: hardware_count
            type: string
        - description: Hardware grouping property
          in: query
          name: hardwareTypeProperty
          schema:
            default: hardware_type
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.CatalogModelListEnvelope'
          description: Page of catalog models, with a token for the next page
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Bad Request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorEnvelope'
          description: Internal Server Error
      security:
        - KubeflowUserID: []
        - BearerAuth: []
      summary: Search catalog models across sources
      tags:
        - ModelCatalogService
