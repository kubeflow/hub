    k8s_io_api_rbac_v1.Subject:
      properties:
        apiGroup:
          description: |-
            apiGroup holds the API group of the referenced subject.
            Defaults to "" for ServiceAccount subjects.
            Defaults to "rbac.authorization.k8s.io" for User and Group subjects.
            +optional
          type: string
        kind:
          description: |-
            kind of object being referenced. Values defined by this API group are "User", "Group", and "ServiceAccount".
            If the Authorizer does not recognized the kind value, the Authorizer should report an error.
            +required
          type: string
        name:
          description: |-
            name of the object being referenced.
            +required
            +k8s:beta(since: "1.37")=+k8s:required
          type: string
        namespace:
          description: |-
            namespace of the referenced object.  If the object kind is non-namespace, such as "User" or "Group", and this value is not empty
            the Authorizer should report an error.
            +optional
          type: string
      type: object
    models.Agent:
      description: An agent with framework, Markdown documentation, environment variables, and OCI images.
      properties:
        artifacts:
          description: OCI image artifacts used to deploy the agent.
          items:
            $ref: '#/components/schemas/models.AgentImageArtifact'
          type: array
          uniqueItems: false
        createTimeSinceEpoch:
          description: Creation time in milliseconds since the Unix epoch, encoded as a string.
          example: "1700000000000"
          format: int64
          type: string
        customProperties:
          additionalProperties:
            $ref: '#/components/schemas/openapi.MetadataValue'
          description: Custom properties keyed by name; each value is selected by metadataType.
          type: object
        description:
          description: Short description of the agent's capabilities.
          example: Researches topics and summarizes sources.
          type: string
        displayName:
          description: Human-readable display name.
          example: Research Assistant
          type: string
        env:
          description: Environment variables required or supported by the deployment.
          items:
            $ref: '#/components/schemas/models.AgentEnvVar'
          type: array
          uniqueItems: false
        framework:
          description: Agent framework, such as langgraph, crewai, or autogen.
          example: langgraph
          type: string
        id:
          description: Unique agent identifier.
          example: "1"
          type: string
        labels:
          description: Labels used for categorization and filtering.
          example:
            - research
            - community
          items:
            type: string
          type: array
          uniqueItems: false
        lastUpdateTimeSinceEpoch:
          description: Last update time in milliseconds since the Unix epoch, encoded as a string.
          example: "1700000000000"
          format: int64
          type: string
        logo:
          description: URL or path of the agent's logo image.
          example: https://example.com/agent-logo.png
          type: string
        name:
          description: Agent name, unique within its catalog source.
          example: research-assistant
          type: string
        readme:
          description: Full agent documentation in Markdown.
          example: '# Research assistant'
          type: string
        repositoryUrl:
          description: URL of the agent's source code repository.
          example: https://github.com/example/research-agent
          format: uri
          type: string
        source_id:
          description: Catalog source providing this agent.
          example: community
          type: string
      type: object
    models.AgentArtifact:
      properties:
        artifactType:
          description: Artifact kind selecting the deployment content or image URI.
          example: template-artifact
          type: string
        content:
          description: Full agent.yaml specification serialized as a JSON string, for template artifacts.
          example: '{"name":"research-agent"}'
          type: string
        createTimeSinceEpoch:
          description: Creation time in milliseconds since the Unix epoch, encoded as a string.
          example: "1700000000000"
          format: int64
          type: string
        id:
          description: Unique artifact identifier.
          example: "1"
          type: string
        lastUpdateTimeSinceEpoch:
          description: Last update time in milliseconds since the Unix epoch, encoded as a string.
          example: "1700000000000"
          format: int64
          type: string
        name:
          description: Human-readable artifact name.
          example: Research agent template
          type: string
        uri:
          description: OCI image URI, when this is an image artifact.
          example: oci://quay.io/example/research-agent:latest
          type: string
      type: object
    models.AgentArtifactList:
      properties:
        items:
          description: Deployment artifacts associated with the agent.
          items:
            $ref: '#/components/schemas/models.AgentArtifact'
          type: array
          uniqueItems: false
        nextPageToken:
          description: Opaque token for retrieving the next page; empty on the final page.
          type: string
        pageSize:
          description: Maximum number of artifacts requested per page.
          example: 10
          type: integer
        size:
          description: Number of artifacts returned in this page.
          example: 1
          type: integer
      type: object
    models.AgentEnvVar:
      properties:
        description:
          description: Purpose of the environment variable and guidance for setting it.
          example: URL of the model inference endpoint.
          type: string
        name:
          description: Environment variable name.
          example: MODEL_ENDPOINT
          type: string
        required:
          description: Whether this variable must be supplied for deployment.
          example: true
          type: boolean
      type: object
    models.AgentImageArtifact:
      properties:
        artifactType:
          description: Artifact kind identifying an agent deployment image.
          example: image-artifact
          type: string
        createTimeSinceEpoch:
          description: Creation time in milliseconds since the Unix epoch, encoded as a string.
          example: "1700000000000"
          format: int64
          type: string
        id:
          description: Unique artifact identifier.
          example: "1"
          type: string
        lastUpdateTimeSinceEpoch:
          description: Last update time in milliseconds since the Unix epoch, encoded as a string.
          example: "1700000000000"
          format: int64
          type: string
        name:
          description: Human-readable artifact name.
          example: Research agent image
          type: string
        uri:
          description: URI of the OCI image used to deploy the agent.
          example: oci://quay.io/example/research-agent:latest
          type: string
      type: object
    models.AgentList:
      properties:
        items:
          description: Agents returned in this page.
          items:
            $ref: '#/components/schemas/models.Agent'
          type: array
          uniqueItems: false
        nextPageToken:
          description: Opaque token for retrieving the next page; empty on the final page.
          type: string
        pageSize:
          description: Maximum number of agents requested per page.
          example: 10
          type: integer
        size:
          description: Number of agents returned in this page.
          example: 1
          type: integer
      type: object
    models.CatalogArtifact:
      properties:
        artifactType:
          description: Artifact category selecting model storage or evaluation metadata.
          example: model-artifact
          type: string
        createTimeSinceEpoch:
          description: Creation time in milliseconds since the Unix epoch, encoded as a string.
          example: "1700000000000"
          format: int64
          type: string
        customProperties:
          additionalProperties:
            $ref: '#/components/schemas/openapi.MetadataValue'
          description: Artifact metadata and evaluation values keyed by custom-property name.
          type: object
        externalId:
          description: Identifier assigned by an external system, when supplied.
          example: upstream-artifact-1
          type: string
        id:
          description: Unique catalog artifact identifier.
          example: artifact-1
          type: string
        lastUpdateTimeSinceEpoch:
          description: Last update time in milliseconds since the Unix epoch, encoded as a string.
          example: "1700000000000"
          format: int64
          type: string
        metricsType:
          description: Evaluation category, when this artifact contains metrics.
          example: security-metrics
          type: string
        name:
          description: Human-readable artifact name.
          example: Model weights
          type: string
        uri:
          description: Physical location of the model artifact, when present.
          example: s3://example-models/model/
          type: string
      type: object
    models.CatalogLabel:
      properties:
        description:
          description: Explanation of what the label signifies.
          example: Sources validated for supported deployments.
          type: string
        displayName:
          description: Human-readable label name.
          example: Validated Sources
          type: string
        name:
          description: Label identifier usable with the sourceLabel query parameter.
          example: validated
          type: string
      type: object
    models.CatalogLabelList:
      properties:
        items:
          description: Labels returned in this page.
