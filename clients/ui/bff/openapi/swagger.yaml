        size:
          description: Number of labels returned in this page.
          example: 1
          type: integer
      type: object
    models.CatalogModel:
      description: Catalog model metadata, documentation, licensing, and validated serving configuration.
      properties:
        createTimeSinceEpoch:
          description: Creation time in milliseconds since the Unix epoch, encoded as a string.
          example: "1700000000000"
          format: int64
          type: string
        customProperties:
          additionalProperties:
            $ref: '#/components/schemas/openapi.MetadataValue'
          description: Custom properties keyed by name; each value is selected by metadataType.
          type: object
        description:
          description: Human-readable summary of the model.
          example: An instruction-tuned language model.
          type: string
        language:
          description: Supported language codes, using ISO 639 identifiers where applicable.
          example:
            - en
            - es
          items:
            type: string
          type: array
          uniqueItems: false
        lastUpdateTimeSinceEpoch:
          description: Last update time in milliseconds since the Unix epoch, encoded as a string.
          example: "1700000000000"
          format: int64
          type: string
        libraryName:
          description: Library used to load or run the model.
          example: transformers
          type: string
        license:
          description: Short name or identifier of the model's license.
          example: apache-2.0
          type: string
        licenseLink:
          description: URL of the full license text.
          example: https://www.apache.org/licenses/LICENSE-2.0
          format: uri
          type: string
        logo:
          description: URL of the model logo; data URLs are supported.
          example: https://example.com/model-logo.png
          type: string
        maturity:
          description: Publication or support maturity level of the model.
          example: Generally Available
          type: string
        name:
          description: Model identifier within its source; it may include slashes.
          example: ibm-granite/granite-3.1-8b-base
          type: string
        provider:
          description: Organization or entity that provides the model.
          example: IBM
          type: string
        readme:
          description: Full model documentation in Markdown.
          example: '# Model documentation'
          type: string
        servingConfig:
          $ref: '#/components/schemas/models.ServingConfig'
          description: Validated runtime settings for deploying and serving this model.
        source_id:
          description: Identifier of the catalog source providing the model.
          example: community
          type: string
        tasks:
          description: Tasks the model is designed to perform.
          example:
            - text-generation
          items:
            type: string
          type: array
          uniqueItems: false
        validatedTasks:
          description: Tasks validated end-to-end for this model, using the same names as tasks.
          example:
            - tool-calling
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    models.CatalogModelArtifactList:
      properties:
        items:
          description: Model and evaluation artifacts returned in this page.
          items:
            $ref: '#/components/schemas/models.CatalogArtifact'
          type: array
          uniqueItems: false
        nextPageToken:
          description: Opaque token for retrieving the next page; empty on the final page.
