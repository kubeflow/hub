# Local development demo/example compose file
# Composes:
# - a MySQL database,
# - a model-registry server built from source connected to the MySQL database.
# - a model-catalog server built from source.
# - a model-registry-ui built from source (standalone mode)
# or
# - a PostgreSQL database,
# - a model-registry server built from source connected to the PostgreSQL database.
# - a model-catalog server built from source.
# - a model-registry-ui built from source (standalone mode)
version: '3.8'
networks:
  hub:
    driver: bridge

services:
  model-registry-ui:
    build:
      context: ./clients/ui
      dockerfile: Dockerfile.standalone
      args:
        DEPLOYMENT_MODE: standalone
        STYLE_THEME: mui-theme
    command:
      - --port=9000
      - --mock-k8s-client=true
      - --mock-mr-client=false
      - --mock-mr-catalog-client=false
      - --dev-mode=true
      - --deployment-mode=standalone
      - --log-level=DEBUG
    container_name: model-registry-ui
    ports:
      - "9000:9000"
    networks:
      - hub
    depends_on:
      - model-registry
      - model-catalog
    profiles:
      - postgres
    extra_hosts:
      - "localhost:host-gateway"

  model-catalog:
    build:
      context: .
      dockerfile: Dockerfile
    image: hub/server:local
    command: ["catalog", "--listen", "0.0.0.0:8081", "--catalogs-path", "/testdata/test-catalog-sources.yaml", "--catalogs-path", "/testdata/test-skill-sources.yaml"]
    container_name: model-catalog
    ports:
      - "8081:8081"
    networks:
      - hub
    volumes:
      - ./catalog/internal/catalog/modelcatalog/testdata:/testdata:z
    depends_on:
      - postgres
    profiles:
      - postgres
    environment:
      - PGHOST=postgres
      - PGDATABASE=model_catalog
      - PGUSER=postgres
      - PGPASSWORD=demo

  model-registry:
    build:
      context: .
      dockerfile: Dockerfile
    image: hub/server:local
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        if [ "$$DB_TYPE" = "postgres" ]; then
          exec /model-registry proxy --hostname 0.0.0.0 --datastore-type embedmd --embedmd-database-type postgres --embedmd-database-dsn "host=postgres port=5432 user=postgres password=demo dbname=model_registry sslmode=disable"
        else
          exec /model-registry proxy --hostname 0.0.0.0 --datastore-type embedmd --embedmd-database-dsn "root:demo@tcp(mysql:3306)/model_registry?charset=utf8mb4"
        fi
    container_name: model-registry
    ports:
      - "8080:8080"
    networks:
      - hub
    depends_on:
      - ${DB_TYPE:-mysql}
    environment:
      - DB_TYPE=${DB_TYPE:-mysql}

  mysql:
    image: mysql:8.3
    container_name: mysql
    command:
      - --datadir=/var/lib/mysql/datadir
      - --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=demo
      - MYSQL_DATABASE=model_registry
    ports:
      - "3306:3306"
    networks:
      - hub
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -D $$MYSQL_DATABASE -uroot -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    profiles:
      - mysql

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      - POSTGRES_DB=model_registry
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=demo
    ports:
      - "5432:5432"
    networks:
      - hub
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/pginit.sql:/docker-entrypoint-initdb.d/pginit.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d model_registry"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    profiles:
      - postgres

volumes:
  mysql_data:
  postgres_data:
